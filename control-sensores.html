<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Sensores Superfy</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Sensores Superfy</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="admin.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <p style="margin-top:20px;">Se actualiza solo cada vez que corres la sincronización en tu Google Sheet de Superfy — esta pantalla es de solo lectura.</p>

  <div id="resumen-sensores" class="resumen-cliente"></div>

  <div class="tabs-vista">
    <button id="tab-estado-btn" class="tab-vista-btn tab-vista-activa">📊 Estado actual</button>
    <button id="tab-historial-btn" class="tab-vista-btn">📜 Historial de eventos</button>
  </div>

  <div id="vista-estado-box">
    <div class="agregar-equipo-box">
      <label><strong>🔄 Registrar cambio de sensor</strong> — para cuando uno falla y se reemplaza por otro en campo (esto no lo captura el Sheet solo).</label>
      <div class="materiales-controles">
        <input type="text" id="cambio-mc" placeholder="MC (ej. MC2600123)">
        <input type="text" id="cambio-serial-viejo" placeholder="Serial que se retira">
        <input type="text" id="cambio-serial-nuevo" placeholder="Serial nuevo">
        <input type="text" id="cambio-ot" placeholder="OT (ej. OT-012, opcional)">
      </div>
      <textarea id="cambio-notas" rows="2" placeholder="Notas (opcional) — ej. motivo del cambio"></textarea>
      <button id="registrar-cambio-btn" class="btn-primario" style="margin-top:8px;">Registrar cambio</button>
      <p id="cambio-msg" class="resultado-msg" hidden></p>
    </div>

    <div class="materiales-controles">
      <input type="text" id="filtro-mc" placeholder="Filtrar por MC...">
      <select id="filtro-conectividad">
        <option value="">Toda conectividad</option>
        <option value="ONLINE">Online</option>
        <option value="OFFLINE">Offline</option>
      </select>
      <select id="filtro-vinculacion">
        <option value="">Toda vinculación</option>
        <option value="VINCULADO">Vinculado</option>
        <option value="DESVINCULADO">Desvinculado</option>
      </select>
    </div>

    <table class="tabla-revision">
      <thead><tr><th>Serial</th><th>MC</th><th>Superfy ID</th><th>Conectividad</th><th>Vinculación</th><th>Última lectura</th><th>Actualizado</th></tr></thead>
      <tbody id="tbody-sensores"><tr><td colspan="7">Cargando...</td></tr></tbody>
    </table>
  </div>

  <div id="historial-box" hidden>
    <div class="materiales-controles">
      <input type="text" id="filtro-hist-mc" placeholder="Filtrar por MC o serial...">
      <select id="filtro-hist-tipo">
        <option value="">Todos los eventos</option>
        <option value="Offline detectado">Offline detectado</option>
        <option value="Online recuperado">Online recuperado</option>
        <option value="Desvinculado">Desvinculado</option>
        <option value="Vinculado">Vinculado</option>
      </select>
    </div>
    <table class="tabla-revision">
      <thead><tr><th>Fecha</th><th>Serial</th><th>MC</th><th>Evento</th><th>OT</th></tr></thead>
      <tbody id="tbody-historial"><tr><td colspan="5">Cargando...</td></tr></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="control-sensores.js"></script>
</body>
</html>
