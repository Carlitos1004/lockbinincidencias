<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Detalle de OT</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Detalle de OT</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="javascript:history.back()" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver</a>

  <div class="materiales-controles">
    <input type="text" id="ot-input" placeholder="Ej: OT-005" list="lista-ots">
    <datalist id="lista-ots"></datalist>
    <button id="buscar-btn">Buscar OT</button>
  </div>

  <p id="buscar-msg" class="resultado-msg" hidden></p>

  <div class="crear-ot-libre-box" id="crear-ot-libre-box" hidden>
    <p><strong>¿No hay ninguna falla o cliente específico?</strong> Crea una OT libre — para actuaciones sin reporte, como un cambio masivo de materiales.</p>
    <div class="materiales-controles">
      <select id="nueva-ot-cliente"><option value="">Cargando clientes...</option></select>
      <input type="text" id="nueva-ot-motivo" placeholder="Motivo (ej: Cambio de 50 baterías no recargables a recargables)">
      <button id="crear-ot-libre-btn" class="btn-primario">Crear OT nueva</button>
    </div>
    <p id="crear-ot-libre-msg" class="resultado-msg" hidden></p>
  </div>

  <div id="ot-contenido" hidden>
    <h2 id="ot-titulo"></h2>
    <p id="ot-meta" class="ot-meta"></p>

    <div class="completada-libre-box" id="completada-libre-box" hidden>
      <label class="opcion-check">
        <input type="checkbox" id="completada-checkbox">
        Marcar esta actuación como completada
      </label>
    </div>

    <div class="instrucciones-box">
      <label for="instrucciones-textarea"><strong>Instrucciones para los operarios</strong></label>
      <textarea id="instrucciones-textarea" rows="3" placeholder="Ej: Prioridad al equipo MC2500001, cliente pidió visita antes de las 12pm..."></textarea>
      <button id="guardar-instrucciones-btn" class="btn-secundario">Guardar instrucciones</button>
      <span id="instrucciones-msg"></span>
    </div>

    <div class="ruta-box">
      <button id="ver-ruta-btn" class="btn-secundario">📍 Ver ruta en Google Maps</button>
      <button id="descargar-btn" class="btn-secundario">⬇️ Descargar como Excel</button>
      <button id="eliminar-ot-btn" class="btn-eliminar" hidden>🗑️ Eliminar esta OT</button>
    </div>

    <div class="agregar-equipo-box">
      <label for="agregar-mc-input"><strong>Agregar un equipo a esta OT</strong></label>
      <div class="agregar-equipo-controles">
        <input type="text" id="agregar-mc-input" placeholder="Ej: MC2500642">
        <select id="agregar-falla-select">
          <option value="">— Falla —</option>
          <option>No comunica</option>
          <option>Error servo</option>
          <option>Vuelco</option>
          <option>Incendio</option>
          <option>Bloqueado</option>
          <option>Sin batería</option>
          <option>Batería Crítica</option>
          <option>Tapa abierta</option>
          <option>Falla de Lector</option>
          <option>Cerradura Trancada</option>
          <option>Vandalismo / Daño Externo</option>
          <option>Revisión general</option>
          <option>Otra</option>
        </select>
        <button id="agregar-equipo-btn" class="btn-primario">Agregar</button>
      </div>
      <p id="agregar-equipo-msg" class="resultado-msg" hidden></p>
    </div>

    <div class="agregar-equipo-box" id="agregar-componente-box" hidden>
      <label><strong>Registrar un componente sin ticket</strong> — para defectuosos encontrados en un lote (ej. revisando baterías de un cambio masivo), sin necesidad de crear un ticket por cada uno.</label>
      <div class="agregar-equipo-controles">
        <input type="text" id="agregar-comp-mc" placeholder="Módulo de Control (opcional)">
        <select id="agregar-comp-tipo">
          <option value="">— Componente —</option>
          <option>Lector Electrónico</option>
          <option>Cierre Electrónico</option>
          <option>Batería Recargable</option>
          <option>Batería No Recargable</option>
          <option>Módulo de Control</option>
        </select>
        <input type="text" id="agregar-comp-serial" placeholder="Serial">
        <input type="text" id="agregar-comp-hallazgo" placeholder="Qué se encontró (ej: no carga, 3.1V)">
        <button id="agregar-componente-btn" class="btn-primario">Registrar</button>
      </div>
      <p id="agregar-componente-msg" class="resultado-msg" hidden></p>
    </div>

    <table class="tabla-revision" id="tabla-ot">
      <thead>
        <tr><th>Módulo</th><th>Fracción</th><th>Falla</th><th>Estado</th><th>Serial Nuevo</th><th>Foto</th><th>Acción / Comentarios</th><th></th></tr>
        <tr class="fila-filtros">
          <th><input type="text" id="filtro-modulo" placeholder="Filtrar..."></th>
          <th></th>
          <th><select id="filtro-falla-select"><option value="">Todas</option></select></th>
          <th>
            <select id="filtro-estado-ticket">
              <option value="">Todos</option>
              <option value="🚨 ABIERTO">Abierto</option>
              <option value="✅ CERRADO">Cerrado</option>
            </select>
          </th>
          <th></th><th></th><th></th><th></th>
        </tr>
      </thead>
      <tbody id="ot-tbody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="sesion-generica.js"></script>
<script src="selector-ots.js"></script>
<script src="ot-detalle.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
