<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Revisión de Taller</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Revisión de Taller</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="admin.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <h2>Buscar por OT</h2>
  <div class="materiales-controles">
    <input type="text" id="ot-input" placeholder="Ej: OT-005" list="lista-ots">
    <datalist id="lista-ots"></datalist>
    <button id="buscar-btn">Buscar</button>
  </div>

  <p id="buscar-msg" class="resultado-msg" hidden></p>

  <table class="tabla-revision" id="tabla-revision" hidden>
    <thead>
      <tr>
        <th>Módulo</th>
        <th>Componente</th>
        <th>Serial</th>
        <th>Estado</th>
        <th>Reparación / Hallazgo</th>
        <th>Destino</th>
        <th>Devuelto</th>
        <th>Foto</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="revision-tbody"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="selector-ots.js"></script>
<script src="garantia-utils.js"></script>
<script src="revision.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
