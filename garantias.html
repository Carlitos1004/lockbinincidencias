<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Garantías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Garantías</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="admin.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <button id="toggle-filtros-btn" class="btn-toggle-filtros">🔽 Filtros</button>

  <div class="panel-filtros" id="panel-filtros" hidden>
    <div class="materiales-controles">
      <input type="text" id="filtro-input" placeholder="Buscar por OT, cliente o módulo..." list="lista-ots">
      <datalist id="lista-ots"></datalist>
      <select id="filtro-garantia">
        <option value="todas">Todas</option>
        <option value="SI">Con garantía (SI)</option>
        <option value="NO">Sin garantía (NO)</option>
      </select>
      <select id="filtro-vigencia">
        <option value="todas">Cualquier vigencia</option>
        <option value="SÍ (Vigente)">Vigente</option>
        <option value="NO (Vencida)">Vencida</option>
        <option value="Sin Registro">Sin registro de fecha</option>
      </select>
    </div>
  </div>

  <div class="tabla-garantias-wrap">
    <table class="tabla-revision" id="tabla-garantias">
      <thead>
        <tr>
          <th>OT</th><th>Cliente</th><th>Módulo</th><th>Dispositivo</th>
          <th>Falla</th><th>Criterio (destino)</th><th>Fecha Entrega</th><th>Vigencia</th><th>Estado Final</th><th>Observación</th><th>Nombre Imagen</th><th></th>
        </tr>
      </thead>
      <tbody id="garantias-tbody">
        <tr><td colspan="12">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="selector-ots.js"></script>
<script src="garantia-utils.js"></script>
<script src="garantias.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
