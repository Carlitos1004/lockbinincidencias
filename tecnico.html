<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Panel Técnico</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Técnico</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body">
  <h2>Hola, <span id="nombre-usuario">—</span></h2>
  <p><a href="ruta.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver a la vista de Ruta (mapa)</a></p>

  <div class="ot-activa-box">
    <strong>OT activa:</strong> <span id="ot-activa-texto">Ninguna — crea o elige una para empezar a reportar</span>
    <div class="ot-activa-controles">
      <input type="text" id="ot-input" placeholder="Ej: OT-005 (para continuar una existente)" list="lista-ots">
      <datalist id="lista-ots"></datalist>
      <button id="ot-usar-btn">Usar esta OT</button>
      <button id="ot-nueva-btn" class="btn-secundario">Crear OT nueva</button>
    </div>
  </div>

  <div id="paso-buscar" hidden>
    <label for="mc-input">Código del equipo (MC)</label>
    <input type="text" id="mc-input" placeholder="MC2602048" autocomplete="off">
    <button id="buscar-btn" class="btn-primario">Buscar equipo</button>
    <p id="buscar-error" class="resultado-msg resultado-error" hidden></p>
  </div>

  <div id="paso-reporte" hidden>
    <div class="equipo-encontrado">
      <strong>Equipo:</strong> <span id="eq-mc"></span> —
      <strong>Cliente:</strong> <span id="eq-cliente"></span> —
      <strong>Fracción:</strong> <span id="eq-fraccion"></span>
    </div>

    <div id="tickets-abiertos" class="tickets-abiertos" hidden></div>

    <label for="falla-select">Falla reportada</label>
    <select id="falla-select">
      <option value="">— Selecciona —</option>
      <option>No comunica</option>
      <option>Error servo</option>
      <option>Vuelco</option>
      <option>Incendio</option>
      <option>Bloqueado</option>
      <option>Sin batería</option>
      <option>Tapa abierta</option>
      <option>Falla de Lector</option>
      <option>Cerradura Trancada</option>
      <option>Vandalismo / Daño Externo</option>
      <option>Otra (especificar en comentarios)</option>
    </select>

    <label for="accion-input">Descripción de la acción (texto libre, opcional)</label>
    <input type="text" id="accion-input" placeholder="Ej: Reset con tarjeta, se revisó comunicación...">

    <fieldset class="grupo-checkbox">
      <legend>¿Se cambió algún componente?</legend>
      <label class="opcion-check"><input type="checkbox" id="cambio-le"> Lector Electrónico (LE)</label>
      <label class="opcion-check"><input type="checkbox" id="cambio-ce"> Cierre Electrónico (CE)</label>
      <label class="opcion-check"><input type="checkbox" id="cambio-ba"> Batería (BA)</label>
      <label class="opcion-check"><input type="checkbox" id="cambio-mc"> Módulo de Control (MC)</label>
      <label class="opcion-check opcion-destacada"><input type="checkbox" id="cambio-completo"> Equipo completo (los 4)</label>
      <label class="opcion-check opcion-secundaria"><input type="checkbox" id="retirado-cliente"> El cliente ya lo había retirado/cambiado por su cuenta (no cuenta como material tuyo)</label>
    </fieldset>

    <div id="tipo-bateria-box" class="tipo-bateria-box" hidden>
      <label for="tipo-bateria"><strong>¿Qué tipo de batería?</strong> (para que cuente bien en Materiales)</label>
      <select id="tipo-bateria">
        <option value="">— Elige —</option>
        <option value="Batería Recargable">Batería Recargable</option>
        <option value="Batería No Recargable">Batería No Recargable</option>
      </select>
    </div>

    <fieldset class="grupo-checkbox">
      <legend>¿Llegó sin algún componente (faltante/perdido)?</legend>
      <label class="opcion-check"><input type="checkbox" id="falta-le"> Falta Lector</label>
      <label class="opcion-check"><input type="checkbox" id="falta-ce"> Falta Cierre</label>
      <label class="opcion-check"><input type="checkbox" id="falta-ba"> Falta Batería</label>
      <label class="opcion-check"><input type="checkbox" id="falta-mc"> Falta Módulo de Control</label>
    </fieldset>

    <label class="opcion-check opcion-alerta"><input type="checkbox" id="vandalismo-check"> Vandalismo / robo (deja registro informativo de los seriales presentes, sin contarlos como cambio)</label>
    <label for="comentarios-input">Comentarios</label>
    <textarea id="comentarios-input" rows="3" placeholder="Observaciones del trabajo realizado"></textarea>

    <label>Estado final del equipo</label>
    <div class="estado-final-opciones">
      <label class="opcion-radio"><input type="radio" name="estado_equipo" value="🟢 FUNCIONANDO"> 🟢 Funcionando</label>
      <label class="opcion-radio"><input type="radio" name="estado_equipo" value="🟡 CAMBIO NECESARIO"> 🟡 Cambio necesario</label>
      <label class="opcion-radio"><input type="radio" name="estado_equipo" value="🔴 PENDIENTE"> 🔴 Pendiente</label>
    </div>

    <div class="botones-reporte">
      <button id="cancelar-btn" class="btn-secundario">Cancelar</button>
      <button id="enviar-btn">Enviar reporte</button>
    </div>

    <p id="reporte-msg" class="resultado-msg" hidden></p>
  </div>

  <h2 style="margin-top:40px;">Mis últimos reportes</h2>
  <div id="mis-reportes">Cargando…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "operario";</script>
<script src="sesion.js"></script>
<script src="selector-ots.js"></script>
<script src="ot-activa.js"></script>
<script src="reporte-tecnico.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
