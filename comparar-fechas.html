<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Comparar fechas de entrega</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Comparar fechas de entrega</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="datos-inventario.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <p style="margin-top:20px;">Sube el Excel <strong>FechasEntregasEquipos</strong> (hojas «Equipos nuevos» y «Módulos sueltos»). Primero solo se compara con lo que ya hay en el sistema; no se cambia nada hasta que pulses «Importar». Se guardan las tres fechas: entrega, factura e inicio de contrato.</p>

  <div class="import-box">
    <input type="file" id="cf-archivo" accept=".xlsx,.xls">
    <button id="cf-analizar" disabled class="btn-primario">Comparar</button>
  </div>
  <p id="cf-estado"></p>
  <div id="cf-salida"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="comparar-fechas-core.js"></script>
<script src="comparar-fechas.js"></script>
</body>
</html>
