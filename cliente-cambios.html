<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Registro de cambios de componentes</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-lockbin.png" alt="LockBin" class="panel-logo-lb">
    <h1>Registro de cambios de componentes</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="cliente.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <div class="agregar-equipo-box" style="margin-top:20px;">
    <label class="cambio-etiqueta">Escribe, elige o escanea el módulo (MC)</label>
    <div class="materiales-controles">
      <span class="campo-scan"><input type="text" id="cambio-mc" list="datalist-equipos-cliente" placeholder="MC..."><button type="button" class="btn-scan" data-destino="cambio-mc" title="Escanear con la cámara" aria-label="Escanear con la cámara">📷</button></span>
      <datalist id="datalist-equipos-cliente"></datalist>
    </div>

    <label class="cambio-etiqueta">Registra los números de serie de la batería retirada y de la nueva</label>
    <div class="materiales-controles">
      <div class="cambio-col">
        <span class="cambio-sub">Componente retirado</span>
        <span class="campo-scan"><input type="text" id="cambio-serial-anterior" placeholder="Serial (si lo conoces)"><button type="button" class="btn-scan" data-destino="cambio-serial-anterior" title="Escanear con la cámara" aria-label="Escanear con la cámara">📷</button></span>
      </div>
      <div class="cambio-col">
        <span class="cambio-sub">Componente nuevo</span>
        <span class="campo-scan"><input type="text" id="cambio-serial-nuevo" placeholder="Serial (si lo conoces)"><button type="button" class="btn-scan" data-destino="cambio-serial-nuevo" title="Escanear con la cámara" aria-label="Escanear con la cámara">📷</button></span>
      </div>
    </div>
    <div id="scan-zona" class="qr-zona" hidden>
      <p id="scan-texto" style="margin:0 0 8px;">Apunta la cámara al código QR de la etiqueta.</p>
      <div id="qr-lector-cliente"></div>
      <button type="button" id="scan-cancelar" class="btn-secundario" style="margin-top:8px;">Cancelar</button>
    </div>
    <label class="cambio-etiqueta" for="cambio-descripcion">Comentarios</label>
    <textarea id="cambio-descripcion" rows="2" placeholder="Cuéntanos qué cambiaron y cuándo (ej: 'Cambiamos la batería el 20/9, no tenemos el serial a mano')."></textarea>
    <button id="cambio-btn" class="btn-primario" style="margin-top:8px;">Enviar cambio</button>
    <p id="cambio-msg" class="resultado-msg" hidden></p>
  </div>

  <table class="tabla-revision" id="tabla-cambios-cliente" style="margin-top:16px;">
    <thead><tr><th>Fecha</th><th>Módulo</th><th>Componente</th><th>Serial anterior → nuevo</th><th>Descripción</th><th>Estado</th></tr></thead>
    <tbody id="cambios-cliente-tbody"><tr><td colspan="6">Cargando...</td></tr></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "cliente";</script>
<script src="sesion.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="cliente-cambios.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
