<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Todas las OT</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Todas las OT</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="admin.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <table class="tabla-revision" id="tabla-ots">
    <thead>
      <tr>
        <th>OT</th><th>Origen</th><th>Fecha</th><th>Creada por</th><th>Clientes</th>
        <th>Equipos</th><th>Tickets abiertos</th><th>Tickets cerrados</th><th>Avance</th><th>Estado General</th><th></th>
      </tr>
      <tr class="fila-filtros">
        <th><input type="text" id="filtro-ot" placeholder="Filtrar..."></th>
        <th>
          <select id="filtro-origen">
            <option value="">Todas</option>
            <option value="normal">Automática (campo)</option>
            <option value="libre">Manual</option>
          </select>
        </th>
        <th></th>
        <th><input type="text" id="filtro-creado-por" placeholder="Filtrar..."></th>
        <th><input type="text" id="filtro-cliente" placeholder="Filtrar..."></th>
        <th></th>
        <th></th>
        <th></th>
        <th>
          <select id="filtro-estado">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completas">Completas</option>
          </select>
        </th>
        <th>
          <select id="filtro-estado-general">
            <option value="">Todos</option>
            <option>En espera de visita</option>
            <option>Visita realizada, en espera de equipos retirados</option>
            <option>En revisión de equipos</option>
            <option>Equipos revisados, en espera de gestión de garantías</option>
            <option>Equipos revisados, clasificación de stock y AMMI realizada</option>
            <option>Equipos revisados, en espera a devolución a cliente</option>
            <option>Equipos devueltos a cliente, en espera de facturación y/o definición de restante</option>
            <option>Orden completada y cerrada</option>
          </select>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody id="ots-tbody">
      <tr><td colspan="9">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="ordenes.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
