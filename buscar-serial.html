<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Buscar por Serial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">

    <h1>Buscar por Serial</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="admin.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <p style="margin-top:20px;">Busca por Módulo de Control o por el serial de cualquier componente (Lector, Cierre, Batería) — te muestra en qué OTs ha aparecido y qué pasó en cada una.</p>

  <div class="materiales-controles">
    <input type="text" id="busqueda-input" placeholder="Ej: MC2500642 o LE2501507">
    <button id="buscar-btn" class="btn-primario">Buscar</button>
  </div>

  <p id="buscar-msg" class="resultado-msg" hidden></p>

  <div id="resultados"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
