<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Gestión de Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-lockbin.jpg" alt="LockBin" class="panel-logo">
    <h1>Gestión de Equipos</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <p><a href="admin.html">← Volver al panel</a></p>

  <h2>1. Filtrar equipos con fallas</h2>
  <div class="materiales-controles">
    <select id="cliente-select">
      <option value="">Cargando clientes...</option>
    </select>
  </div>

  <fieldset class="grupo-checkbox">
    <legend>Estado de montaje a incluir</legend>
    <label class="opcion-check"><input type="checkbox" id="estado-instalado" checked> Instalado</label>
    <label class="opcion-check"><input type="checkbox" id="estado-pendiente"> Pendiente (aún sin instalar)</label>
  </fieldset>

  <button id="filtrar-btn">Filtrar equipos con fallas</button>

  <p id="filtrar-msg" class="resultado-msg" hidden></p>

  <div id="resultado-filtro" hidden>
    <h2 style="margin-top:28px;">2. Selecciona los equipos para la OT</h2>
    <div class="seleccion-controles">
      <label><input type="checkbox" id="check-todos" checked> Seleccionar / deseleccionar todos</label>
      <span id="total-encontrados"></span>
    </div>

    <table class="tabla-revision" id="tabla-equipos">
      <thead>
        <tr><th></th><th>Módulo</th><th>Estado</th><th>Fracción</th><th>Fallas detectadas</th></tr>
      </thead>
      <tbody id="equipos-tbody"></tbody>
    </table>

    <h2 style="margin-top:28px;">3. Generar la Orden de Trabajo</h2>

    <label for="manuales-textarea"><strong>Equipos adicionales</strong> (que no salieron en el filtro — uno por línea o separados por coma)</label>
    <textarea id="manuales-textarea" rows="2" placeholder="MC2500001, MC2500002..." style="width:100%;max-width:500px;padding:9px;border:1.5px solid var(--gris-200);border-radius:8px;margin:6px 0 14px;"></textarea>

    <button id="generar-btn">Generar OT con los equipos seleccionados</button>
    <p id="generar-msg" class="resultado-msg" hidden></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "manager";</script>
<script src="sesion.js"></script>
<script src="gestion-equipos.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
