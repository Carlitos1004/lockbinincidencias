<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Historial</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-header">
  <div class="panel-header-marca">
    <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="panel-logo-fv">
    <h1>Historial de Fallas y Reparaciones</h1>
  </div>
  <button id="logout-btn">Cerrar sesión</button>
</div>

<div class="panel-body panel-body-ancho">
  <a href="cliente.html" class="btn-volver"><span class="btn-volver-flecha">←</span> Volver al panel</a>

  <table class="tabla-revision" id="tabla-historial-cliente" style="margin-top:20px;">
    <thead><tr><th>Fecha</th><th>Módulo</th><th>Falla</th><th>Estado</th><th>Acción / Comentarios</th></tr></thead>
    <tbody id="historial-cliente-tbody"><tr><td colspan="5">Cargando...</td></tr></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>const ROL_ESPERADO = "cliente";</script>
<script src="sesion.js"></script>
<script src="cliente-historial.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
