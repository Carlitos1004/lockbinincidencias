<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Iniciar sesión</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-panel-form">
    <div class="login-card con-sombra">
      <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="login-logo-fv">
      <p class="subtitle">Inicia sesión para continuar</p>

      <form id="login-form">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="email" placeholder="tucorreo@ejemplo.com">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" id="login-btn">Entrar</button>
      </form>

      <p id="error-msg" class="error-msg" hidden></p>
    </div>
  </div>

  <div class="login-panel-visual">
    <div class="visual-texto">
      <h2>Gestión de campo, LockBin</h2>
      <p>Rutas, reportes y control de componentes.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>

<footer class="footer-fv">
  <img src="assets/logo-formato-verde.png" alt="Formato Verde" class="footer-fv-logo">
  <span>Un producto de Formato Verde</span>
</footer>
</body>
</html>
