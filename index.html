<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LockBin — Iniciar sesión</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>LockBin</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form id="login-form">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="email" placeholder="tucorreo@ejemplo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

      <button type="submit" id="login-btn">Entrar</button>
    </form>

    <p id="error-msg" class="error-msg" hidden></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
